    <script>
        // --- 1. FITUR HITUNG MUNDUR 24 JAM ---
        let totalSeconds = 24 * 60 * 60; // 24 jam dalam detik

        function updateTimer() {
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            let hStr = hours < 10 ? "0" + hours : hours;
            let mStr = minutes < 10 ? "0" + minutes : minutes;
            let sStr = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("countdown").innerText = `${hStr}:${mStr}:${sStr}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            }
        }
        setInterval(updateTimer, 1000);

        // --- 2. EFEK SUARA MENYERAMKAN OTOMATIS (WEB AUDIO API) ---
        // Menggunakan sintesis suara agar tidak memerlukan file eksternal
        let audioCtx = null;

        function playCreepySound() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Membuat gelombang suara frekuensi rendah yang tidak nyaman (drone/hum)
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'sawtooth'; // Suara kasar khas 8-bit/retro
            osc.frequency.setValueAtTime(60, audioCtx.currentTime); // Frekuensi rendah mendengung
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 2);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 3);
        }

        // Jalankan suara secara berkala otomatis setiap 4 detik
        window.addEventListener('load', () => {
            // Beberapa browser memblokir audio otomatis sebelum ada interaksi, 
            // tapi kita coba picu otomatis menggunakan interaksi simulasi/event listener klik pertama.
            setInterval(playCreepySound, 4000);
        });
